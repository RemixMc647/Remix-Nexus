<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remix Nexus - Offline</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #05070d;
      color: #e8eefc;
      font-family: system-ui, sans-serif;
      padding: 1.5rem;
      box-sizing: border-box;
    }

    h1 {
      font-size: 1.6rem;
      margin: 0 0 .6rem;
    }

    p {
      color: #9db0d6;
      margin: 0 0 1.4rem;
    }

    button {
      background: #2f6bff;
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: .8rem 1.6rem;
      font-size: 1rem;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main>
    <h1>You're offline</h1>

    <p>Check your internet connection. Remix Nexus will load again once you're back online.</p>

    <button onclick="location.reload()">Try again</button>
  </main>

  <script>
    // Reload automatically as soon as the connection comes back
    window.addEventListener("online", () => location.reload());
  </script>
</body>

</html>
