<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b15"><title>Legacy Hall — RemixVerse</title><link rel="stylesheet" href="styles.css"></head>
<body data-page="legacy">
  
<!-- BACK TO NEXUS REALM BUTTON -->
<style>
  .nexus-realm-back {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
    padding: 13px 20px;
    margin: 12px 0 20px;
    border: 1px solid rgba(174, 145, 255, 0.65);
    border-radius: 14px;
    background:
      linear-gradient(
        120deg,
        rgba(123, 79, 255, 0.22),
        rgba(60, 190, 255, 0.12)
      );
    color: #f4efff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 0 22px rgba(128, 86, 255, 0.15);
    transition: all 0.2s ease;
  }

  .nexus-realm-back:hover {
    transform: translateY(-3px);
    border-color: #bba5ff;
    background:
      linear-gradient(
        120deg,
        rgba(123, 79, 255, 0.38),
        rgba(60, 190, 255, 0.23)
      );
    box-shadow: 0 0 28px rgba(128, 86, 255, 0.35);
  }

  .nexus-realm-back .nr-arrow {
    color: #c4b1ff;
    font-size: 22px;
    line-height: 1;
  }

  .nexus-realm-back .nr-star {
    color: #7ee7ff;
    font-size: 17px;
  }

  .nexus-realm-back:focus-visible {
    outline: 3px solid #7ee7ff;
    outline-offset: 4px;
  }

  @media (max-width: 480px) {
    .nexus-realm-back {
      width: 100%;
      box-sizing: border-box;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .nexus-realm-back {
      transition: none;
    }

    .nexus-realm-back:hover {
      transform: none;
    }
  }
</style>

<a
  class="nexus-realm-back"
  href="https://remix-nexus-tygt.onrender.com/NexusRealm.html"
>
  <span class="nr-arrow" aria-hidden="true">←</span>
  <span>Back to Nexus Realm</span>
  <span class="nr-star" aria-hidden="true">✦</span>
</a>

  <main class="page">
<section class="hero"><div class="eyebrow">RemixVerse archives</div><h1><span class="gradient-text">The Legacy Hall</span></h1><p>Every life leaves a mark. Review the people you have lived as, compare your scores and see which achievements you have unlocked.</p><div class="actions"><a class="btn primary" href="play.html">Live another life →</a><button class="btn danger" id="reset-legacy">Reset local progress</button></div></section>
<div class="grid" id="legacy-root"></div>
</main>
<script src="storage.js"></script><script src="data.js"></script><script src="engine.js"></script><script src="fx.js"></script><script src="layout.js"></script><script src="account.js"></script>
<script>
window.LLAccountReady.then(function(){ if (!window.LL.currentUser) return; (function(){const root=document.getElementById('legacy-root');const S=window.LL.storage;const D=window.LL.data;const F=window.LL.fx;function esc(s){return F.esc(s)}function render(){const l=S.loadLegacy(),t=S.totals(),lives=l.lives||[],ach=Object.keys(l.achievements||{});root.innerHTML=`<section class="card span-12"><div class="metric-row"><div class="metric"><span>Lives recorded</span><strong>${t.lives}</strong></div><div class="metric"><span>Total years</span><strong>${t.years}</strong></div><div class="metric"><span>Oldest life</span><strong>${t.oldest}</strong></div><div class="metric"><span>Achievements</span><strong>${t.achievements}</strong></div></div></section><section class="card span-7"><h2>Past lives</h2>${lives.length?lives.map((x,i)=>`<div class="job-card"><header><div><strong>${esc(x.name||'Unknown life')} · Age ${x.age||0}</strong><p>${esc(x.city||'Unknown city')} · ${esc(x.cause||'Life completed')}</p></div><span class="pill">${esc(x.rank||'Unranked')}</span></header><p>Score: <b>${x.score||0}</b> · Peak wealth: <b>$${Math.round(x.peakMoney||0).toLocaleString('en-US')}</b> · Achievements: ${x.achievements||0}</p></div>`).join(''):'<div class="empty">No past lives yet. Start playing and your finished lives will be saved here.</div>'}</section><section class="card span-5"><h2>Achievements</h2>${D.ACHIEVEMENTS.map(a=>{const unlocked=!!l.achievements[a.id];return `<div class="person"><div class="avatar">${unlocked?'🏆':'🔒'}</div><div class="person-main"><strong>${esc(a.name||a.id)}</strong><span class="small">${unlocked?'Unlocked':'Not yet unlocked'}</span></div><span class="pill ${unlocked?'good':''}">${unlocked?'✓':'—'}</span></div>`}).join('')}</section>`}document.getElementById('reset-legacy').addEventListener('click',function(){if(confirm('Reset all RemixVerse lives, achievements and saved game on this browser? This cannot be undone.')){S.resetAll();render();}});render();})(); });
</script></body></html>
