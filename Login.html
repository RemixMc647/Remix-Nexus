  <div class="auth-page-wrap">

    <div class="header">
      <a href="./index.html" class="brand-link"><h1 class="page-title">🎮 ♨𝕽𝖊𝖒𝖎𝖝 𝕹𝖊𝖝𝖚𝖘</h1></a>
      <p class="sub">Log in to your gaming society</p>
    </div>

    <div class="auth-card" role="region" aria-label="Login">
      <form id="login-form" class="auth-form" autocomplete="off">
        <div class="field">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" name="loginEmail" type="email" required placeholder="you@example.com" />
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" name="loginPassword" type="password" required minlength="6" placeholder="Your password" />
        </div>

        <div id="login-message" class="message" aria-live="polite"></div>

        <div class="actions">
          <button class="primary" type="submit" id="login-submit-btn">Log in</button>
          <a class="secondary-link" href="./Signup.html">Create an account</a>
        </div>
      </form>

      <p class="auth-forgot">
        <a href="#" id="forgotPasswordLink" class="secondary-link">Forgot password?</a>
      </p>

      <div id="forgotPasswordBox" style="display:none;">
        <div class="field">
          <label for="forgotEmail">Enter your email</label>
          <input id="forgotEmail" name="forgotEmail" type="email" placeholder="you@example.com">
        </div>
        <div class="actions">
          <button class="primary" type="button" id="forgotSubmitBtn">Send reset link</button>
        </div>
        <div id="forgot-message" class="message" aria-live="polite"></div>
      </div>
    </div>

    <p class="auth-note">
      New here? <a href="./Signup.html">Sign up</a> to join chat rooms
