<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b15"><title>Legacy Hall — LifeLoop</title><link rel="stylesheet" href="styles.css">
<style>
.nexus-exit-wrap{position:fixed;top:16px;right:16px;z-index:100005;max-width:calc(100vw - 32px);animation:rv-exit-enter .7s cubic-bezier(.16,1,.3,1) both}
.nexus-exit-btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:12px 17px;border:2px solid rgba(255,255,255,.68);border-radius:17px;background:linear-gradient(115deg,#ff3bbd,#8157ff,#22caff,#b8ff45,#ff9a42,#ff3bbd);background-size:300% 300%;color:#fff!important;text-decoration:none!important;font:900 13px/1.2 system-ui,sans-serif;letter-spacing:.025em;text-shadow:0 2px 5px #25104c;box-shadow:0 8px 0 rgba(33,17,83,.5),0 0 28px rgba(255,59,189,.4);animation:rv-exit-rainbow 5s ease infinite,rv-exit-float 3s ease-in-out infinite;white-space:nowrap;transition:transform .18s,filter .18s}
.nexus-exit-btn:hover{filter:brightness(1.18);transform:translateY(-3px) scale(1.04)}
@media(max-width:520px){.nexus-exit-wrap{top:9px;right:9px}.nexus-exit-btn{font-size:11px;padding:10px 11px;border-radius:13px}}
</style>
</head>
<body data-page="legacy">
<div class="nexus-exit-wrap"><a class="nexus-exit-btn" href="../NexusRealm.html" aria-label="Go and exit back to Nexus Realm">← Go &amp; Exit to Nexus Realm</a></div>
<main class="page">
<section class="hero"><div class="eyebrow">LifeLoop archives</div><h1><span class="gradient-text">The Legacy Hall</span></h1><p>Every life leaves a mark. Review the people you have lived as, compare your scores and see which achievements you have unlocked.</p><div class="actions"><a class="btn primary" href="play.html">Live another life →</a><button class="btn danger" id="reset-legacy">Reset local progress</button></div></section>
<div class="grid" id="legacy-root"></div>
</main>
<script src="storage.js"></script><script src="data.js"></script><script src="engine.js"></script><script src="fx.js"></script><script src="layout.js"></script><script src="account.js"></script>
<script>
window.LLAccountReady.then(function(){ if (!window.LL.currentUser) return; (function(){const root=document.getElementById('legacy-root');const S=window.LL.storage;const D=window.LL.data;const F=window.LL.fx;function esc(s){return F.esc(s)}function render(){const l=S.loadLegacy(),t=S.totals(),lives=l.lives||[],ach=Object.keys(l.achievements||{});root.innerHTML=`<section class="card span-12"><div class="metric-row"><div class="metric"><span>Lives recorded</span><strong>${t.lives}</strong></div><div class="metric"><span>Total years</span><strong>${t.years}</strong></div><div class="metric"><span>Oldest life</span><strong>${t.oldest}</strong></div><div class="metric"><span>Achievements</span><strong>${t.achievements}</strong></div></div></section><section class="card span-7"><h2>Past lives</h2>${lives.length?lives.map((x,i)=>`<div class="job-card"><header><div><strong>${esc(x.name||'Unknown life')} · Age ${x.age||0}</strong><p>${esc(x.city||'Unknown city')} · ${esc(x.cause||'Life completed')}</p></div><span class="pill">${esc(x.rank||'Unranked')}</span></header><p>Score: <b>${x.score||0}</b> · Peak wealth: <b>$${Math.round(x.peakMoney||0).toLocaleString('en-US')}</b> · Achievements: ${x.achievements||0}</p></div>`).join(''):'<div class="empty">No past lives yet. Start playing and your finished lives will be saved here.</div>'}</section><section class="card span-5"><h2>Achievements</h2>${D.ACHIEVEMENTS.map(a=>{const unlocked=!!l.achievements[a.id];return `<div class="person"><div class="avatar">${unlocked?'🏆':'🔒'}</div><div class="person-main"><strong>${esc(a.name||a.id)}</strong><span class="small">${unlocked?'Unlocked':'Not yet unlocked'}</span></div><span class="pill ${unlocked?'good':''}">${unlocked?'✓':'—'}</span></div>`}).join('')}</section>`}document.getElementById('reset-legacy').addEventListener('click',function(){if(confirm('Reset all LifeLoop lives, achievements and saved game on this browser? This cannot be undone.')){S.resetAll();render();}});render();})(); });
</script><script src="remix-vibe.js"></script>
</body></html>
